<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sequoia Level Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8a93a3;
    --accent: #7cc26b;
    --accent2: #f0a648;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px 0; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .label { color: var(--muted); font-size: 13px; }
  .value { font-size: 22px; font-weight: 600; }
  .value.lvl { color: var(--accent); }
  .value.xp { color: var(--accent2); }
  .bar {
    height: 8px;
    background: #21252e;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.4s ease;
  }
  h2 { font-size: 16px; margin: 0 0 12px 0; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }
  li:last-child { border-bottom: none; }
  li .lv { color: var(--accent); font-weight: 600; }
  li .ts { color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; }
  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.err { color: #e07070; }
  .status.stale { color: #d8a23e; }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .panel-head h2 { margin: 0; }
  .btn-group { display: flex; gap: 8px; }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.copied { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sequoia Level Tracker</h1>
  <div class="sub">Server-side polling every 5 minutes via GitHub Actions</div>

  <div class="panel">
    <div class="row">
      <span class="label">Current Level</span>
      <span class="value lvl" id="level">–</span>
    </div>
    <div class="row">
      <span class="label">XP</span>
      <span class="value xp" id="xp">–</span>
    </div>
    <div class="bar"><div id="xpbar" style="width:0%"></div></div>
    <div class="row" style="margin-top: 16px;">
      <span class="status" id="status">Loading…</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Level-up History</h2>
      <div class="btn-group">
        <button id="copyBtn" disabled>Copy ano command</button>
        <button id="copyPayoutBtn" disabled>Copy Raid Payout Message</button>
      </div>
    </div>
    <ul id="history"></ul>
    <div class="empty" id="emptyMsg" style="display:none">No level-ups recorded yet.</div>
  </div>

  <div class="footer">Source: Wynncraft API v3 · stored in repo</div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function fmtBerlin(iso, offsetHours = 0) {
  const d = new Date(new Date(iso).getTime() - offsetHours * 3600 * 1000);
  return d.toLocaleString("en-GB", {
    dateStyle: "short",
    timeStyle: "medium",
    timeZone: "Europe/Berlin",
  });
}
const fmtTs = (iso) => fmtBerlin(iso, 1);
const fmtNow = (iso) => fmtBerlin(iso, 0);

function relativeAge(iso) {
  const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} min ago`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h < 24) return m ? `${h}h ${m}m ago` : `${h}h ago`;
  const d = Math.floor(h / 24);
  const rh = h % 24;
  return rh ? `${d}d ${rh}h ago` : `${d}d ago`;
}

function renderHistory(history) {
  const ul = $("history");
  const empty = $("emptyMsg");
  ul.innerHTML = "";
  if (!history || history.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  for (const entry of history.slice().reverse()) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="lv">Level ${entry.level}</span><span class="ts">${fmtTs(entry.ts)}</span>`;
    ul.appendChild(li);
  }
}

function daysAgo(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  return (ms / 86400000).toFixed(4);
}

function sortedHistory(history) {
  return history.slice().sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

function updateCopyBtn(history) {
  const enabled = history && history.length >= 2;
  $("copyBtn").disabled = !enabled;
  $("copyPayoutBtn").disabled = !enabled;
}

function buildPayoutMessage(history) {
  const sorted = sortedHistory(history);
  const last = sorted[0];
  const prev = sorted[1];
  const days = ((new Date(last.ts).getTime() - new Date(prev.ts).getTime()) / 86400000).toFixed(4);
  return `# Level ${last.level} Reached!
${days} days
<@&1030198924323078194> please contact me, <@420289176421007360>, <@581255561941614607>, <@894980597557100554>, <@261115988831895552>, <@366506301544726528> or <@356962089878945793> for your payout

0.5LE per raid`;
}

async function copyToClipboard(text, btn, defaultLabel) {
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied!";
    btn.classList.add("copied");
  } catch {
    btn.textContent = "Copy failed";
  }
  setTimeout(() => {
    btn.textContent = defaultLabel;
    btn.classList.remove("copied");
  }, 1500);
}

let currentData = null;

$("copyBtn").addEventListener("click", async () => {
  if (!currentData || !currentData.history || currentData.history.length < 2) return;
  const sorted = sortedHistory(currentData.history);
  const cmd = `-graids -g SEQ -r ${daysAgo(sorted[1].ts)} ${daysAgo(sorted[0].ts)}`;
  copyToClipboard(cmd, $("copyBtn"), "Copy ano command");
});

$("copyPayoutBtn").addEventListener("click", () => {
  if (!currentData || !currentData.history || currentData.history.length < 2) return;
  const msg = buildPayoutMessage(currentData.history);
  copyToClipboard(msg, $("copyPayoutBtn"), "Copy Raid Payout Message");
});

async function load() {
  try {
    const res = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentData = data;

    if (data.current) {
      $("level").textContent = data.current.level;
      $("xp").textContent = data.current.xpPercent + "%";
      $("xpbar").style.width = Math.min(100, data.current.xpPercent) + "%";
      const age = relativeAge(data.current.updatedAt);
      $("status").textContent = `Last updated: ${fmtNow(data.current.updatedAt)} (${age})`;
      $("status").classList.remove("err");
      $("status").classList.toggle("stale", Date.now() - new Date(data.current.updatedAt).getTime() > 15 * 60 * 1000);
    } else {
      $("status").textContent = "No data yet — waiting for first poll";
    }

    renderHistory(data.history);
    updateCopyBtn(data.history);
  } catch (e) {
    $("status").textContent = `Error: ${e.message}`;
    $("status").classList.add("err");
  }
}

load();
setInterval(load, 30 * 1000);
</script>
</body>
</html>
