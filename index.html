<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sequoia Level Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8a93a3;
    --accent: #7cc26b;
    --accent2: #f0a648;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px 0; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .label { color: var(--muted); font-size: 13px; }
  .value { font-size: 22px; font-weight: 600; }
  .value.lvl { color: var(--accent); }
  .value.xp { color: var(--accent2); }
  .bar {
    height: 8px;
    background: #21252e;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.4s ease;
  }
  h2 { font-size: 16px; margin: 0 0 12px 0; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }
  li:last-child { border-bottom: none; }
  li .lv { color: var(--accent); font-weight: 600; }
  li .ts { color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; }
  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.err { color: #e07070; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sequoia Level Tracker</h1>
  <div class="sub">Serverseitiges Polling alle 5 Minuten via GitHub Actions</div>

  <div class="panel">
    <div class="row">
      <span class="label">Aktuelles Level</span>
      <span class="value lvl" id="level">–</span>
    </div>
    <div class="row">
      <span class="label">XP</span>
      <span class="value xp" id="xp">–</span>
    </div>
    <div class="bar"><div id="xpbar" style="width:0%"></div></div>
    <div class="row" style="margin-top: 16px;">
      <span class="status" id="status">Lade…</span>
    </div>
  </div>

  <div class="panel">
    <h2>Level-up History</h2>
    <ul id="history"></ul>
    <div class="empty" id="emptyMsg" style="display:none">Noch keine Level-ups aufgezeichnet.</div>
  </div>

  <div class="footer">Quelle: Wynncraft API v3 · gespeichert im Repo</div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function fmtTs(iso) {
  const d = new Date(iso);
  return d.toLocaleString("de-DE", { dateStyle: "short", timeStyle: "medium" });
}

function renderHistory(history) {
  const ul = $("history");
  const empty = $("emptyMsg");
  ul.innerHTML = "";
  if (!history || history.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  for (const entry of history.slice().reverse()) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="lv">Level ${entry.level}</span><span class="ts">${fmtTs(entry.ts)}</span>`;
    ul.appendChild(li);
  }
}

async function load() {
  try {
    const res = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (data.current) {
      $("level").textContent = data.current.level;
      $("xp").textContent = data.current.xpPercent + "%";
      $("xpbar").style.width = Math.min(100, data.current.xpPercent) + "%";
      $("status").textContent = `Zuletzt aktualisiert: ${fmtTs(data.current.updatedAt)}`;
      $("status").classList.remove("err");
    } else {
      $("status").textContent = "Noch keine Daten — warte auf ersten Poll";
    }

    renderHistory(data.history);
  } catch (e) {
    $("status").textContent = `Fehler: ${e.message}`;
    $("status").classList.add("err");
  }
}

load();
setInterval(load, 30 * 1000);
</script>
</body>
</html>
